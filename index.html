<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Riya ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }
        #subText {
            color: #555;
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 25px 0;
            min-height: 24px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }
        button {
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, font-size 0.2s ease;
            touch-action: manipulation;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            z-index: 20;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            z-index: 999;
        }
        .celebration h2 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .celebration p {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <h1>Riya, kya tum mujhe maaf karogi? ❤️</h1>
        <p id="subText"></p>
        <div class="buttons">
            <button id="yesBtn" type="button">Yes! ❤️</button>
            <button id="noBtn" type="button">No 😢</button>
        </div>
    </div>

    <script>
        let noCount = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const subText = document.getElementById('subText');
        const card = document.getElementById('card');

        function moveNoButton(e) {
            if (e) e.preventDefault();
            noCount++;

            if (noCount <= 4) {
                // Screen ke andar random safe position nikalna
                noBtn.style.position = 'fixed';
                const maxX = window.innerWidth - noBtn.offsetWidth - 20;
                const maxY = window.innerHeight - noBtn.offsetHeight - 20;
                
                const randomX = Math.max(20, Math.floor(Math.random() * maxX));
                const randomY = Math.max(20, Math.floor(Math.random() * maxY));
                
                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';

                // Yes button ko thoda bada karna
                let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
                yesBtn.style.fontSize = (currentSize + 3) + 'px';
            } else {
                // 4 baar bhaagne ke baad final message
                subText.innerText = "Maan jao na Riya cutie please 🥺";
                noBtn.style.display = 'none';
            }
        }

        // Click aur Touch dono ke liye listener
        noBtn.addEventListener('click', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton, { passive: false });

        yesBtn.addEventListener('click', function() {
            noBtn.style.display = 'none';
            card.innerHTML = `
                <div class="celebration">
                    <h2>Yay! Thank you so much Riya! 🥰❤️</h2>
                    <p>
                        Tum sach mein duniya ki sabse pyari aur samajhdar ladki ho! ✨<br><br>
                        Mujhe pata hai pichle kuch time mein meri taraf se kaafi galtiyan aur kamiyaan rahi hain, jiske liye main dil se sorry hoon. Lekin tumhara mujh par abhi bhi bharosa rakhna mere liye sabse badi baat hai.<br><br>
                        Tumhari smile mere liye sabse zyada matter karti hai. Main wada karta hoon ki ab hamesha tumhara khayal rakhunga aur kabhi shikayat ka mauka nahi dunga. 💖🌹
                    </p>
                </div>
            `;
        });
    </script>
</body>
</html>
