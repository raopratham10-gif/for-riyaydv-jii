<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Riya ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: relative;
        }
        .hidden {
            display: none;
        }
        .celebration h2 {
            color: #2b9348;
            font-size: 26px;
        }
        .celebration p {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div id="questionContainer">
            <h1>Riya, kya tum mujhe maaf karogi? ❤️</h1>
            <p id="subText">Ab gussa thook bhi do na cutie! Maan jao na please? 😊</p>
            <div class="buttons">
                <button id="yesBtn" onclick="onYesClick()">Yes! ❤️</button>
                <button id="noBtn" onclick="onNoClick()">No 😢</button>
            </div>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        const messages = [
            "Soch lo acche se! 🥺",
            "Dil mat dukhao yaar, maan jao na! 😭",
            "Aise naaraz rahogi toh kaise chalega cutie? 💔",
            "Maan jao na Riya cutie please 🥺❤️"
        ];

        function onNoClick() {
            noClickCount++;
            const noBtn = document.getElementById('noBtn');
            const subText = document.getElementById('subText');
            const yesBtn = document.getElementById('yesBtn');

            if (noClickCount < 4) {
                // Move button around randomly 3-4 times
                subText.innerText = messages[noClickCount - 1];
                
                // Increase Yes button size slightly to tempt her
                let currentSize = window.getComputedStyle(yesBtn).fontSize;
                yesBtn.style.fontSize = (parseFloat(currentSize) + 2) + 'px';

                // Random jump
                const randomX = (Math.random() - 0.5) * 150;
                const randomY = (Math.random() - 0.5) * 100;
                noBtn.style.transform = translate(${randomX}px, ${randomY}px);
            } else {
                // Final plea message after 3-4 clicks
                subText.innerText = "Maan jao na Riya cutie please 🥺❤️ Ab aur 'No' mat dabao!";
                noBtn.style.display = 'none'; // Hide No button finally
            }
        }

        function onYesClick() {
            const card = document.getElementById('card');
            card.innerHTML = `
                <div class="celebration">
                    <h2>Yay! Thank you so much! 🥰❤️</h2>
                    <p>
                        <b>Riya,</b><br>
                        Mujhe pata hai pichla dedh saal thoda mushkil raha aur meri taraf se bhi kaafi kamiyaan rahiin, jiske liye main sach mein dil se sharminda hoon.<br><br>
                        Lekin tumhara yeh kehna ki <i>"mujhe koi teesra banda beech mein nahi lana, bharosa hai itna toh"</i> mere liye bahut मायने rakhta hai. Main apni saari galtiyon ko sudhar raha hoon aur tumhare is bharose ko hamesha banaye rakhunga.<br><br>
                        Tum meri best friend bhi ho aur meri priority bhi. Chalo ab saara gussa khatam aur ek nayi shuruwat karte hain! ✨💖
                    </p>
                </div>
            `;
        }
    </script>
</body>
</html>
